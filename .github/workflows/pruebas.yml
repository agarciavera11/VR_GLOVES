name: Pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Firmware en PC (I2C y Wi-Fi simulados)
        run: make -C firmware/test_host
      - name: Herramientas Python
        run: python tools/test_herramientas.py
